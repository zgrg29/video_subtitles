name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build portable EXE
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QwenSubtitle-windows-x64
          path: |
            dist/QwenSubtitle-portable-0.1.0-win64.zip
            dist/QwenSubtitle-portable.sha256
            dist/QwenSubtitle-portable-zip.sha256
      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QwenSubtitle-portable-0.1.0-win64.zip
            dist/QwenSubtitle-portable.sha256
            dist/QwenSubtitle-portable-zip.sha256
          generate_release_notes: true
